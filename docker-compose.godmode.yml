# DANGER: This deployment intentionally grants unrestricted host administration.
services:
  remoteops:
    build: .
    image: ${REMOTEOPS_IMAGE:-remoteops-mcp:local}
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      REMOTEOPS_CONFIG: /config/remoteops.yaml
      REMOTEOPS_BOOTSTRAP_EMAIL: ${REMOTEOPS_BOOTSTRAP_EMAIL:-}
      REMOTEOPS_BOOTSTRAP_PASSWORD_FILE: /run/secrets/remoteops_bootstrap_password
      REMOTEOPS_GODMODE: "true"
    secrets:
      - remoteops_bootstrap_password
    ports:
      - "${REMOTEOPS_BIND:-127.0.0.1}:${REMOTEOPS_PORT:-8080}:8080"
    volumes:
      - /:/host:rshared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REMOTEOPS_CONFIG_FILE:-./remoteops.example.yaml}:/config/remoteops.yaml:ro
      - remoteops-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  remoteops_bootstrap_password:
    file: ${REMOTEOPS_BOOTSTRAP_PASSWORD_FILE:-./secrets/remoteops_bootstrap_password}

volumes:
  remoteops-data:
