server:
  name: remoteops
  listen: ":8080"

auth:
  # oauth-local is the runtime default; it is explicit here for operator clarity.
  mode: oauth-local
  oauth_local:
    # Change this to the exact public HTTPS origin before deployment.
    public_origin: https://this.dev.privacyperfect.com
    data_file: /data/oauth.db
    bootstrap_email_env: REMOTEOPS_BOOTSTRAP_EMAIL
    bootstrap_password_file_env: REMOTEOPS_BOOTSTRAP_PASSWORD_FILE
    allowed_redirect_uris:
      - https://chatgpt.com/connector_platform_oauth_redirect
      - https://platform.openai.com/apps-manage/oauth
      - https://claude.ai/api/mcp/auth_callback
      - https://claude.com/api/mcp/auth_callback
    access_token_minutes: 15
    refresh_token_days: 30
    browser_session_hours: 8

docker:
  enabled: true
  socket: unix:///var/run/docker.sock

filesystem:
  roots:
    - name: managed
      path: /managed
      read_only: false

compose:
  projects: []
  # - name: example
  #   path: /managed/example
  #   file: compose.yaml

permissions:
  default_role: viewer

shell:
  enabled: false

changes:
  retention_days: 30
  max_records: 10000

limits:
  max_log_bytes: 1048576
  max_file_read_bytes: 1048576
  max_execution_seconds: 60
  max_request_bytes: 1048576
  requests_per_minute: 120
  mutations_per_minute: 20
